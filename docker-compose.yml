services:
  db:
    image: postgres:16-alpine
    container_name: studymanager_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - common_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: studymanager_backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:51234:8000"
    volumes:
      - ./data:/app/data
      - ./duty.json:/app/duty.json
    networks:
      - common_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  common_net:
    external: true
