[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
disallow_untyped_defs = False
warn_return_any = False
warn_unused_ignores = False

disable_error_code = import-untyped, union-attr, arg-type, prop-decorator, var-annotated, misc, operator, assignment, return-value, dict-item, index, attr-defined, call-overload, type-var

[mypy-tgbot.*]
ignore_errors = True

[mypy-migrations.*]
ignore_errors = True